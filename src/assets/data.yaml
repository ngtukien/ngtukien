cv:
  name: Nguyễn Tự Kiên
  headline: Cloud Solutions Engineer
  location: Hà Nội, Việt Nam
  email: ngtukien218.work@gmail.com
  phone: "+84395376905"
  social_networks:
    - network: LinkedIn
      username: ngtukien218
    - network: GitHub
      username: ngtukien
  sections:
    Kinh nghiệm làm việc:
      - company: Tổng Công ty Mạng lưới Viettel
        position: Cloud Solutions Engineer
        date: 08/2026 – Nay
        highlights:
          - "**Nền tảng Cloud DBaaS:** Nghiên cứu và triển khai hạ tầng Database-as-a-Service trên Kubernetes sử dụng CloudNativePG Operator; tự động hóa toàn bộ vòng đời cơ sở dữ liệu (cấp phát, HA auto-failover, backup/PITR lên S3)."
          - "**Database Migration Service (MGS):** Xây dựng giải pháp di chuyển dữ liệu (PostgreSQL → PostgreSQL, Oracle → PostgreSQL) qua CDC streaming (Debezium, Kafka) và snapshot; tối ưu cutover giảm thiểu downtime, hỗ trợ rollback an toàn."
          - "**Công nghệ:** Kubernetes, CloudNativePG, PostgreSQL, Debezium, Apache Kafka, Open Everest, Docker, ..."

    Dự án:
      - name: "[ToiYeuPTIT DevOps](https://devops.toiyeuptit.com/)"
        date: 04/2026 – 06/2026
        summary: Nền tảng học tập DevOps tương tác (tương tự KodeKloud), cung cấp môi trường lab thực tế cho học viên.
        highlights:
          - "**Trách nhiệm:** Thiết kế, triển khai cụm Kubernetes và Container Runtime lõi; tự động hóa cấp phát, cô lập (sandbox) và thu hồi tài nguyên ổn định khi nhiều học viên truy cập đồng thời."
          - "**Công nghệ:** Kubernetes, Docker, Sysbox Runtime, Ansible, Spring Boot."

    Học vấn:
      - institution: Học viện Công nghệ Bưu chính Viễn thông (PTIT)
        area: Công nghệ phần mềm
        degree: Kỹ sư Công nghệ phần mềm – Lớp Tài năng
        date: 2023 – 2028 (dự kiến)
        highlights:
          - "**CPA:** 3.58 / 4.00 — học bổng 4 kỳ liên tiếp."
          - "**Môn học tiêu biểu:** Cơ sở dữ liệu phân tán, Hệ điều hành, Mạng máy tính, ..."

    Danh hiệu & Giải thưởng:
      - name: Đại sứ tài năng – Viettel Digital Talent 2026
        date: 07/2026
      - name: Giải Ba – PTIT Bootcamp "Hack to Lead" 2025
        date: 08/2025
      - name: Giải Nhì – Computing Track cuộc thi Huawei ICT 2024 – 2025 (Vòng Quốc tế)
        date: 05/2025
      - name: Giải Xuất sắc – Computing Track cuộc thi Huawei ICT 2024 – 2025 (Vòng Khu vực APAC)
        date: 02/2025
      - name: Giải Nhì – Computing Track cuộc thi Huawei ICT 2024 – 2025 (Vòng Quốc gia)
        date: 12/2024

    Chứng chỉ:
      - name: PTIT Samsung 2025 DevOps Basis
        date: 06/2025
      - name: TOEIC 620
        date: 11/2024

    Hoạt động:
      - company: CLB Tôi yêu PTIT
        position: Thành viên team Dev-Cloud
        date: 2025 – Nay
        highlights:
          - Phát triển sản phẩm công nghệ của CLB và tổ chức workshop chia sẻ kiến thức Cloud/DevOps.
      - company: Lab ươm mầm tài năng – NITS
        position: Thành viên
        date: 2025 – Nay
        highlights:
          - Nghiên cứu dự án công nghệ và hỗ trợ đào tạo chuyên môn cho sinh viên khóa dưới.
      - company: Liên chi Đoàn Khoa CNTT1 – PTIT
        position: Thành viên ban Hậu cần
        date: 2023 – Nay
        highlights:
          - Hỗ trợ tổ chức các khóa học lập trình, chiến dịch tình nguyện và sự kiện sinh viên.

locale:
  language: vietnamese
  last_updated: ""

design:
  theme: classic
  page:
    size: a4
    show_top_note: false
    show_footer: false
    top_margin: 1.0cm
    bottom_margin: 1.0cm
    left_margin: 1.6cm
    right_margin: 1.6cm
  colors:
    body: rgb(30,30,30)
    name: rgb(0,0,0)
    headline: rgb(70,70,70)
    connections: rgb(50,50,50)
    section_titles: rgb(0,0,0)
    links: rgb(0,0,0)
  typography:
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 26pt
      headline: 11pt
      connections: 9.5pt
      section_titles: 1.15em
    line_spacing: 0.75em
    alignment: justified-with-no-hyphenation
    small_caps:
      section_titles: false
    bold:
      name: true
      section_titles: true
  links:
    underline: false
    show_external_link_icon: true
  header:
    alignment: center
    space_below_name: 0.3cm
    space_below_headline: 0.25cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ""
      space_between_connections: 0.45cm
  section_titles:
    type: with_full_line
    line_thickness: 0.6pt
    space_above: 0.5cm
    space_below: 0.28cm
  sections:
    space_between_regular_entries: 0.26cm
    space_between_text_based_entries: 0.08cm
  entries:
    date_and_location_width: 3.6cm
    side_space: 0cm
    space_between_columns: 0.2cm
    short_second_row: false
    summary:
      space_above: 0.08cm
    highlights:
      bullet: •
      space_left: 0.15cm
      space_above: 0.16cm
      space_between_items: 0.14cm
      space_between_bullet_and_text: 0.45em
  templates:
    education_entry:
      main_column: |-
        **INSTITUTION**
        *DEGREE*
        HIGHLIGHTS
      degree_column: null
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**
        *POSITION*
        HIGHLIGHTS
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
